name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Linux · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Execute tests
        run: PYTHONPATH=scripts python -m pytest -v

  windows:
    name: Windows · Python 3.13
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev-windows.txt

      - name: Execute tests
        run: python -m pytest -v

  lockfiles-linux:
    name: Linux dependency lock files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

  lockfiles-windows:
    name: Windows dependency lock files
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify hash-locked Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev-windows.txt

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.7

      - name: Run Ruff
        run: ruff check scripts tests
